<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Recipes we love, passed around the table.">
    <title>The Family Recipe Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script defer src="config.js"></script>
    <script defer src="db.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <a class="brand-title" href="#/">The Family Recipe Box</a>
          <p class="tagline">Recipes we love, passed around the table.</p>
        </div>
        <div class="header-actions">
          <button class="button add-button" id="add-recipe" type="button">+ Add a recipe</button>
          <div class="menu-wrap">
            <button class="menu-button" id="family-menu-button" type="button" aria-expanded="false" aria-controls="family-menu" aria-label="Open menu">
              <span aria-hidden="true">☰</span>
            </button>
            <nav class="family-menu" id="family-menu" aria-label="Family menu" hidden></nav>
          </div>
        </div>
      </div>
    </header>

    <main id="app" class="page-content" tabindex="-1">
      <p class="status-message" role="status">Loading recipes…</p>
    </main>

    <dialog class="password-dialog" id="password-dialog" aria-labelledby="password-title">
      <form class="password-form" id="password-form">
        <h2 id="password-title">Enter the family password</h2>
        <p class="password-error" id="password-error" role="alert" hidden></p>
        <label class="form-label" for="family-password">Family password</label>
        <input class="form-input" id="family-password" name="password" type="password" autocomplete="current-password" required>
        <div class="form-actions">
          <button class="button button-secondary" id="cancel-password" type="button">Cancel</button>
          <button class="button button-primary" id="submit-password" type="submit">Continue</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
